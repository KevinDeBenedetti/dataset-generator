[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Scrapy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fake-useragent>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langfuse>=4.14.4",
    "openai>=2.9.0",
    "pydantic>=2.0.0",
    "pytest>=9.1.1",
    "requests>=2.32.5",
    "scrapy>=2.17.0,<2.18",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
    "prek>=0.4.13",
]
migration = [
    "alembic>=1.19.1",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true
