[project]
name = "dataset-generator"
version = "0.14.0"
description = "A collection of datasets powered by FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.1.0",
    # The "standard" extra minus fastapi-cloud-cli (and its sentry-sdk), which
    # the image would ship without using.
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143.0",
    "httpx>=0.28.1",
    # Capped below 4.0 until the provider (services/providers/openai.py) is
    # checked against the 4.x client.
    "openai>=3.26.1,<4.0.0",
    # Imported directly — JWTs (services/auth.py) and the AES-GCM secret store
    # (core/crypto.py) — so declared here, not left to authlib to pull in.
    "joserfc>=1.7.7",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    "uvicorn[standard]>=0.54.0",
    "bcrypt>=5.0.0",
    "authlib>=1.9.1",
    # Signs Starlette's SessionMiddleware cookie (the SSO state).
    "itsdangerous>=2.2.0",
    "redis>=8.1.0",
    # Redis' own FastAPI integration — backs the login rate limiter
    # (services/rate_limit.py). Alpha (0.x): pinned to a minor range so a
    # breaking 0.10 can't land silently on an auth-adjacent control. 0.9 only
    # dropped REDIS_RATE_LIMIT_TRUST_PROXY, read by its HTTP dependency, which
    # the limiter doesn't use; tests/services/test_rate_limit.py pins the
    # backend calls it makes.
    "fastapi-redis-sdk>=0.9.1,<0.10.0",
    # 2.x moves the layout code into pymupdf and pulls pymupdf4llm. 2.0 itself
    # is skipped: it initialises that layout engine on import (measured: 3.8 s
    # and +240 MB in every process that imports it, the API and the worker
    # included). 2.1 fixes it; `make upgrade` takes it once it clears the
    # 7-day cooldown (2026-11-09). The renderer's tests pass on 2.0.
    "pymupdf>=1.28.2,!=2.0,<3.0",
    # Capped below 2.0 until the Hub code (services/hub.py, huggingface.py) is
    # checked against 2.x; fastembed, which required <2, is gone.
    "huggingface-hub>=1.3.0,<2.0.0",
    # Vector collections built from Hub datasets (services/collections.py). Its
    # in-memory mode runs the collection tests without a Qdrant server.
    "qdrant-client>=1.20.0",
    # The Hub dataset viewer (services/hub.py): reads a split's JSONL/CSV/
    # Parquet files into a columnar table, then searches, filters, sorts and
    # profiles it without turning every row into a Python dict.
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.4.0",
    # Tests run against a real, throwaway Postgres container (there is no
    # embeddable Postgres, and the app is Postgres-only now), so Docker must be
    # reachable to run the suite.
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "prek>=0.5.5",
    # starlette.testclient prefers httpx2 and warns (StarletteDeprecationWarning)
    # when it falls back to httpx — a warning slated to become an error. Only
    # TestClient needs it: the app's own HTTP calls (github, etc.)
    # still use the httpx pinned in the runtime dependencies above, and the two
    # install side by side under different module names.
    "httpx2>=2.13.1",
]

[tool.uv]
package = false
# The same week-long cooldown as .github/dependabot.yml: `uv lock --upgrade`
# only takes a release once it is a week old, so a hijacked package is caught
# upstream before it lands here.
exclude-newer = "7 days"

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule set (UP, SIM, TRY, BLE, LOG…),
# which turned ~700 pre-existing style findings into CI lint failures. Pin the
# selection explicitly so the gate no longer moves with the ruff version; opt
# into a newer family deliberately, in its own change. On top of the historic
# default (E4/E7/E9/F): S (bandit), B (bugbear) and ASYNC (blocking calls in
# async code).
select = ["E4", "E7", "E9", "F", "S", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in a default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and sign in with fake passwords.
"apps/server/tests/**" = ["S101", "S105", "S106", "S107"]
# Migrations build their SQL from fixed identifiers, never from input.
"apps/server/migrations/**" = ["S608"]
