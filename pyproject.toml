[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Crawl4AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    # QA generation calls the OpenAI-compatible endpoint directly via the openai
    # SDK (see services/agent.py) — no agent framework / LiteLLM layer. crawl4ai
    # runs as a separate Docker service, so neither is a Python dependency.
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "instructor>=1.14.3",
    "langfuse>=4.9.0",
    "openai>=2.41.1",
    "pydantic>=2.13.4",
    "pytest>=9.0.2",
    "sqlmodel>=0.0.24",
    "alembic>=1.18.1",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.13.0",
    "ty>=0.0.49",
    "prek>=0.2.23",
]
migration = [
    "alembic>=1.16.5",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true
