name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default; the jobs that write say so.
permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@25fe357b3609dfa591519ee8bdf19c1334a74cdd # v0.39.0
    with:
      # A known high/critical vulnerability in the web UI's bun.lock, or any
      # known one in uv.lock (pip-audit), fails the pipeline before the build.
      run-node-audit: true
      node-working-directory: apps/next
      run-python-audit: true
      run-secret-scan: true
      # Pull requests only: refuses a change that adds a vulnerable dependency.
      run-dependency-review: true
      run-codeql: true
      codeql-languages: '["python", "javascript-typescript"]'
    # security.yml declares no caller secrets — nothing to pass.

  ci-python:
    name: CI Python (server)
    needs: security
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-python.yml@25fe357b3609dfa591519ee8bdf19c1334a74cdd # v0.39.0
    with:
      python-version: "3.14"
      working-directory: "."
      run-lint: true
      run-format: true
      run-typecheck: true
      run-test: true
      run-coverage: true
      coverage-fail-under: 70

  ci-node:
    name: CI Node (next)
    needs: security
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-node.yml@25fe357b3609dfa591519ee8bdf19c1334a74cdd # v0.39.0
    with:
      node-version: "24.22.2"
      working-directory: apps/next
      package-manager: bun
      run-lint: true
      # Runs `bun run typecheck` (tsc --noEmit). oxlint alone never checks types,
      # so without this nothing guarded the front-end against a type error — in
      # particular one introduced by regenerating apps/next/api from the schema.
      run-typecheck: true
      run-test: true
      # next build needs no backend at build time; enable as a pre-merge gate on PRs.
      run-build: ${{ github.event_name == 'pull_request' }}

  # apps/next/openapi.json is the committed API contract; the front-end client
  # is generated from it on every build (ci-node included). Dump it from the
  # app here and fail on any diff, so an endpoint or schema change can't ship
  # without the contract the front-end builds against.
  api-schema-drift:
    name: API schema drift
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      # Dumps the schema straight from the app (no server to boot) and diffs.
      # Fix with `make api-schema`, then commit.
      - run: make api-check

  # Central docs site (kevindebenedetti.github.io) polls this repo's docs/ on its
  # own schedule — no dispatch, no GitHub App needed here.

  # Production pipeline: main → release-please
  release:
    name: Release
    needs: [ci-python, ci-node, api-schema-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@25fe357b3609dfa591519ee8bdf19c1334a74cdd # v0.39.0
    with:
      # The config's extra-files keep pyproject.toml, apps/next/package.json,
      # apps/server/main.py and the committed OpenAPI schema (its info.version) on
      # the released version — and uv.lock's own entry for the project, so
      # `uv sync --locked` and the schema-drift check still pass once the release
      # PR lands.
      config-file: .github/release/release-please-config-release.json
      manifest-file: .github/release/.release-please-manifest.json
    # No token secret: release-please runs on GITHUB_TOKEN (needs "Allow GitHub
    # Actions to create and approve pull requests"; CI on the release PR waits
    # for "Approve workflows to run").

  # A tag created with GITHUB_TOKEN triggers no workflow, so images.yml never
  # sees the release-please tag: build the release's images from here.
  images:
    name: Images
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # `$/…`, GitHub's self-repository form, is what zizmor asks for, but actionlint
    # 1.7.12 rejects it still: the workspace form stays until actionlint knows it.
    uses: ./.github/workflows/images.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release.outputs.tag }}
