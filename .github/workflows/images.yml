name: Images

# Builds the production images and publishes them to GHCR:
#
#   ghcr.io/<owner>/dataset-generator-server   API + job worker (one image)
#   ghcr.io/<owner>/dataset-generator-next     web UI
#
# Only `main` produces images:
# * a `v*` tag (created by release-please when its release PR is merged on
#   main) → :vX.Y.Z and :latest
# * workflow_dispatch, run from `main`, tags the build :sha-<short>
#   (to test a deployment before a release)
#
# The deployment (GitOps) pins the tag it wants: a version that has no image
# here makes its migration Job fail on ImagePullBackOff — so the release is
# only "done" when this workflow is green.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        default: ""
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    # A manual run only from main; a tag run is checked against main below.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: apps/server/Dockerfile
          - image: next
            context: apps/next
            dockerfile: apps/next/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag pushed from some other branch must not publish an image.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main — refusing to publish an image"
            exit 1
          }

      # GHCR wants a lower-case repository path; the owner may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dataset-generator-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # Foreign-architecture builds (arm64 from an amd64 runner) need QEMU.
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.platforms != '' || vars.IMAGE_PLATFORMS != '' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          # amd64 by default; set the IMAGE_PLATFORMS repository variable (or the
          # dispatch input) to add arm64, e.g. "linux/amd64,linux/arm64".
          platforms: ${{ inputs.platforms || vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # Build provenance/SBOM attestations stay off: they turn the tag into
          # an OCI index, which some GitOps image updaters don't follow.
          provenance: false
