title = "Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Example env file — variable names only, values are always blank/placeholder, never real secrets"
paths = [
  '''(^|/)\.env\.example$''',
]

[[allowlists]]
description = "Server tests: fake keys and canary tokens (sk-canary-…, hf_Canary…) that exist to prove secrets never leak from the API, logs or the database — none is a real credential"
paths = [
  '''(^|/)apps/server/tests/''',
]
