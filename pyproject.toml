[project]
name = "datasets"
version = "0.1.0"
description = "A collection of datasets powered by FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    # Capped below 3.0: instructor still requires openai>=2,<3 (pins
    # jiter<0.15, which openai 3.x's jiter>=0.16 requirement conflicts with).
    # Lift the cap once instructor supports openai 3.
    "openai>=2.44.0,<3.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.47",
    "alembic>=1.20.0",
    "uvicorn[standard]>=0.53.0",
    "bcrypt>=5.0.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    # Redis' own FastAPI integration — backs the login rate limiter
    # (services/rate_limit.py). Alpha (0.x): pinned to a minor range so a
    # breaking 0.9 can't land silently on an auth-adjacent control.
    "fastapi-redis-sdk>=0.8.0,<0.9.0",
    "pymupdf>=1.28.2",
    "huggingface-hub>=2.0.0",
    # QA generation agent (services/agent.py) runs as a single-node LangGraph
    # graph over a LangChain ChatOpenAI model — see that module for why.
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.4.0",
    # Tests run against a real, throwaway Postgres container (there is no
    # embeddable Postgres, and the app is Postgres-only now), so Docker must be
    # reachable to run the suite.
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "prek>=0.5.3",
    # starlette.testclient prefers httpx2 and warns (StarletteDeprecationWarning)
    # when it falls back to httpx — a warning slated to become an error. Only
    # TestClient needs it: the app's own HTTP calls (github, etc.)
    # still use the httpx pinned in the runtime dependencies above, and the two
    # install side by side under different module names.
    "httpx2>=2.13.1",
]
migration = [
    "alembic>=1.16.5",
]

[tool.uv]
package = false

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule set (UP, SIM, TRY, BLE, LOG…),
# which turned ~700 pre-existing style findings into CI lint failures. Pin the
# historic default selection explicitly so the gate no longer moves with the
# ruff version; opt into the newer families deliberately, in their own change.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
relative_files = true
