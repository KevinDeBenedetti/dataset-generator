[pytest]
# Pytest configuration for the server tests
testpaths = apps/server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra test summary info
addopts =
    -v
    --strict-markers
    --tb=short
    ; --disable-warnings

# PyMuPDF (SWIG bindings) triggers three "builtin type Swig… has no __module__
# attribute" DeprecationWarnings on Python 3.13 when it is imported — third-party
# and still present in its latest release, nothing this repo can fix. Only that
# message is silenced (the copy printed again at interpreter exit included);
# every other warning stays visible.
filterwarnings =
    ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    model: Database model tests
    service: Service layer tests
    slow: Slow running tests

# Coverage settings
[coverage:run]
source = apps/server
omit =
    */tests/*
    */migrations/*
    */migrations/env.py
    */migrations/utils/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */alembic.ini

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
skip_empty = True
