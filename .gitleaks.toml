title = "Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Example env file — variable names only, values are always blank/placeholder, never real secrets"
paths = [
  '''(^|/)\.env\.example$''',
]

[[allowlists]]
description = "The canary tokens of the server tests (sk-canary-…, hf_Canary…), made to prove secrets never leak from the API, logs or the database: only those shapes are exempt — no path, so a real key pasted into a test is still caught"
regexTarget = "secret"
regexes = [
  '''^sk-canary-[0-9A-Za-z]+$''',
  '''^hf_Canary[0-9A-Za-z]+$''',
]
