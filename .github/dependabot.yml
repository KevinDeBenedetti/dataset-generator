version: 2

# One weekly PR grouping every dependency update across all ecosystems.
multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "bun"
    directory: "apps/next/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-all"

  - package-ecosystem: "uv"
    directory: "."
    patterns: ["*"]
    multi-ecosystem-group: "weekly-all"
    ignore:
      # Pinned <2 in pyproject.toml: fastembed and tokenizers still require
      # huggingface-hub<2, so Dependabot's 2.x bump is unresolvable. Drop this
      # once they support 2.x (together with the pyproject cap).
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
