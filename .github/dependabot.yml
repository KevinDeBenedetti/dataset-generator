version: 2

# One weekly PR grouping every dependency update across all ecosystems.
multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "bun"
    directory: "apps/next/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-all"

  - package-ecosystem: "uv"
    directory: "."
    patterns: ["*"]
    multi-ecosystem-group: "weekly-all"
