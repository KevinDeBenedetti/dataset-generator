services:
  next:
    container_name: next
    restart: always
    depends_on:
      server:
        condition: service_healthy
    build:
      context: ./apps/next
      dockerfile: Dockerfile
      target: dev
      args:
        APP_PORT: ${NEXT_PORT:-3000}
      # Enable BuildKit for optimizations
      x-bake:
        cache-from:
          - type=local,src=/tmp/.buildx-cache
        cache-to:
          - type=local,dest=/tmp/.buildx-cache
    env_file:
      - .env
    ports:
      - ${NEXT_HOST_PORT:-8080}:${NEXT_PORT:-3000}
    volumes:
      - ./apps/next:/app
      - next_node_modules:/app/node_modules
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${NEXT_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  server:
    container_name: server-fastapi
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: dev
      args:
        APP_PORT: ${SERVER_PORT:-8000}
      # Enable BuildKit for optimizations
      x-bake:
        cache-from:
          - type=local,src=/tmp/.buildx-cache
        cache-to:
          - type=local,dest=/tmp/.buildx-cache
    ports:
      - "${SERVER_HOST_PORT:-8000}:8000"
    volumes:
      - ./apps/server:/app/server
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - server_venv:/app/.venv
    restart: always

volumes:
  next_node_modules:
  server_venv:
