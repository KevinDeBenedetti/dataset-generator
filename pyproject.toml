[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Crawl4AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    # QA generation calls the OpenAI-compatible endpoint directly via the openai
    # SDK (see services/agent.py) — no agent framework / LiteLLM layer. crawl4ai
    # runs as a separate Docker service, so neither is a Python dependency.
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langfuse>=4.14.4",
    # Capped below 3.0: instructor 1.15.x still requires openai>=2,<3, and the
    # SDK surface used here (chat.completions, embeddings, models.list) is the
    # same in both majors — lift the cap once instructor supports openai 3.
    "openai>=2.44.0,<3.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
    "uvicorn[standard]>=0.52.3",
    "bcrypt>=5.0.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.4.0",
    # Tests run against a real, throwaway Postgres container (there is no
    # embeddable Postgres, and the app is Postgres-only now), so Docker must be
    # reachable to run the suite.
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "prek>=0.4.13",
    # starlette.testclient prefers httpx2 and warns (StarletteDeprecationWarning)
    # when it falls back to httpx — a warning slated to become an error. Only
    # TestClient needs it: the app's own HTTP calls (scraper, github, langfuse)
    # still use the httpx pinned in the runtime dependencies above, and the two
    # install side by side under different module names.
    "httpx2>=2.10.0",
]
migration = [
    "alembic>=1.16.5",
]

[tool.uv]
package = false

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule set (UP, SIM, TRY, BLE, LOG…),
# which turned ~700 pre-existing style findings into CI lint failures. Pin the
# historic default selection explicitly so the gate no longer moves with the
# ruff version; opt into the newer families deliberately, in their own change.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
relative_files = true
