services:
  next:
    container_name: next
    restart: always
    depends_on:
      server:
        condition: service_healthy
    build:
      context: ./apps/next
      dockerfile: Dockerfile
      target: dev
      args:
        APP_PORT: ${NEXT_PORT:-3000}
      # Enable BuildKit for optimizations
      x-bake:
        cache-from:
          - type=local,src=/tmp/.buildx-cache
        cache-to:
          - type=local,dest=/tmp/.buildx-cache
    env_file:
      - .env
    # Bridge NEXT_PORT (project convention) to PORT, which `next dev -p` honours,
    # so a single variable drives the host mapping, container port, healthcheck and Next.
    environment:
      PORT: ${NEXT_PORT:-3000}
    ports:
      - ${NEXT_HOST_PORT:-3000}:${NEXT_PORT:-3000}
    volumes:
      - ./apps/next:/app
      - next_node_modules:/app/node_modules
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${NEXT_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    # Source is bind-mounted above for instant HMR; watch rebuilds the image
    # when dependencies or build config change so you don't have to do it by hand.
    develop:
      watch:
        - action: rebuild
          path: ./apps/next/package.json
        - action: rebuild
          path: ./apps/next/bun.lock
        - action: rebuild
          path: ./apps/next/next.config.ts

  server:
    container_name: server-fastapi
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: dev
      args:
        APP_PORT: ${SERVER_PORT:-8000}
      # Enable BuildKit for optimizations
      x-bake:
        cache-from:
          - type=local,src=/tmp/.buildx-cache
        cache-to:
          - type=local,dest=/tmp/.buildx-cache
    ports:
      - "${SERVER_HOST_PORT:-8000}:8000"
    volumes:
      - ./apps/server:/app/server
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - server_venv:/app/.venv
    restart: always
    # Source is bind-mounted above for uvicorn --reload; watch rebuilds the image
    # when Python dependencies change.
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

volumes:
  next_node_modules:
  server_venv:
