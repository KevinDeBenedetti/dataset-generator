name: Images

# Builds the production images and publishes them to GHCR:
#
#   ghcr.io/<owner>/dataset-generator-server   API + job worker (one image)
#   ghcr.io/<owner>/dataset-generator-next     web UI
#
# Only `main` produces images:
# * a release: ci-cd.yml calls this workflow once release-please has tagged
#   it (a tag created with GITHUB_TOKEN triggers no workflow) → :vX.Y.Z and
#   :latest; a `v*` tag pushed by hand does the same through `push`
# * workflow_dispatch, run from `main`, tags the build :sha-<short> (to test
#   a deployment before a release), or with `tag` rebuilds that release as
#   :vX.Y.Z (`gh workflow run images.yml -f tag=vX.Y.Z`)
#
# Deployment needs nothing from this repo: Renovate, on the infra repo, sees the
# new vX.Y.Z on GHCR and opens (then automerges) one PR bumping the four
# `image:` lines of infra/apps/dataset-generator. It only offers tags that exist
# here — so the release is only "done" when this workflow is green, and a
# workflow_dispatch build (sha-<short>) is never deployed.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild as :vX.Y.Z (empty: build main as :sha-<short>)"
        default: ""
        required: false
      platforms:
        description: "Target platforms (comma-separated)"
        default: ""
        required: false

concurrency:
  # Not github.workflow: called from ci-cd.yml that is the caller's name, and
  # sharing the caller's group would deadlock the two.
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    # A manual run only from main; a tag run is checked against main below.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # sign the provenance attestation (Sigstore OIDC)
      attestations: write  # store it with GitHub's attestations API
    env:
      # The release being built: the input (release pipeline, manual rebuild)
      # or the pushed tag; empty for a manual run from main without one.
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            dockerfile: apps/server/Dockerfile
          - image: next
            context: apps/next
            dockerfile: apps/next/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # A tag that is not a release, or not on main, must not publish an image.
      - name: Tag is a release on main
        if: env.RELEASE_TAG != ''
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$RELEASE_TAG' is not a release tag (vX.Y.Z)"; exit 1 ;;
          esac
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main || {
            echo "::error::$RELEASE_TAG is not on main — refusing to publish an image"
            exit 1
          }

      # GHCR wants a lower-case repository path; the owner may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dataset-generator-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # Foreign-architecture builds (arm64 from an amd64 runner) need QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ inputs.platforms != '' || vars.IMAGE_PLATFORMS != '' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # The checked-out commit, not the triggering one: a rebuild runs from
          # main but labels the release's own revision.
          context: git
          # :latest only follows a new release, never a manual rebuild.
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && github.event_name != 'workflow_dispatch' }}
            type=sha,prefix=sha-,enable=${{ env.RELEASE_TAG == '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          # amd64 by default; set the IMAGE_PLATFORMS repository variable (or the
          # dispatch input) to add arm64, e.g. "linux/amd64,linux/arm64".
          platforms: ${{ inputs.platforms || vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # BuildKit's own provenance/SBOM stay off: they turn the tag into an
          # OCI index, which some GitOps image updaters don't follow. The
          # provenance is attested separately below instead.
          provenance: false

      # SLSA build provenance, signed with Sigstore and stored by GitHub, not in
      # the registry: the tag stays a plain image manifest.
      # Verify with `gh attestation verify oci://<image>@<digest> -R <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
