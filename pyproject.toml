[project]
name = "datasets"
version = "0.1.0"
description = "A collection of datasets powered by FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.1.0",
    "fastapi[standard]>=0.142.3",
    "httpx>=0.28.1",
    # Capped below 3.0 until the provider (services/providers/openai.py) is
    # checked against the 3.x client.
    "openai>=3.26.0,<4.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    "uvicorn[standard]>=0.54.0",
    "bcrypt>=5.0.0",
    "authlib>=1.8.0",
    # Signs Starlette's SessionMiddleware cookie (the SSO state).
    "itsdangerous>=2.2.0",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    # Redis' own FastAPI integration — backs the login rate limiter
    # (services/rate_limit.py). Alpha (0.x): pinned to a minor range so a
    # breaking 0.9 can't land silently on an auth-adjacent control.
    "fastapi-redis-sdk>=0.8.1,<0.9.0",
    "pymupdf>=1.28.2",
    # Capped below 2.0: fastembed and tokenizers (every local embedding stack
    # needs the latter) still require huggingface-hub<2. Lift the cap once
    # they support 2.x.
    "huggingface-hub>=1.3.0,<2.0.0",
    # Local sentence embeddings (services/semantic.py): ONNX Runtime, no torch.
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.4.0",
    # Tests run against a real, throwaway Postgres container (there is no
    # embeddable Postgres, and the app is Postgres-only now), so Docker must be
    # reachable to run the suite.
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.16.9",
    "ty>=0.0.85",
    "prek>=0.5.5",
    # starlette.testclient prefers httpx2 and warns (StarletteDeprecationWarning)
    # when it falls back to httpx — a warning slated to become an error. Only
    # TestClient needs it: the app's own HTTP calls (github, etc.)
    # still use the httpx pinned in the runtime dependencies above, and the two
    # install side by side under different module names.
    "httpx2>=2.13.1",
]
# Scheduled dataset jobs (server/jobs): the SDK bundles the Claude Code binary,
# so it stays out of the default install. The server image and the
# qa-dataset-sync workflow opt in with `uv sync --group jobs`.
jobs = [
    "claude-agent-sdk>=0.2.164",
]

[tool.uv]
package = false

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule set (UP, SIM, TRY, BLE, LOG…),
# which turned ~700 pre-existing style findings into CI lint failures. Pin the
# historic default selection explicitly so the gate no longer moves with the
# ruff version; opt into the newer families deliberately, in their own change.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
relative_files = true
