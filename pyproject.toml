[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Scrapy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fake-useragent>=2.2.0",
    "fastapi[standard]>=0.136.0",
    "httpx>=0.28.1",
    "instructor>=1.15.1",
    "langfuse>=4.3.1",
    "openai>=2.32.0",
    "pydantic>=2.13.2",
    "pytest>=9.0.3",
    "requests>=2.33.1",
    "scrapy>=2.15.0,<2.16",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "ty>=0.0.31",
    "prek>=0.3.9",
]
migration = [
    "alembic>=1.18.4",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true
