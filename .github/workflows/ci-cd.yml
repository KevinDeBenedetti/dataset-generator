name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    name: Security
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@4dd2b01e64a758b51bfd3d2395130cac8920a6b4 # v0.12.0
    with:
      run-node-audit: false
      run-python-audit: false
      run-secret-scan: true
      run-codeql: false
    # security.yml declares no caller secrets — nothing to pass.

  ci-python:
    name: CI Python (server)
    needs: security
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-python.yml@4dd2b01e64a758b51bfd3d2395130cac8920a6b4 # v0.12.0
    with:
      python-version: "3.13"
      working-directory: "."
      run-lint: true
      run-format: true
      run-typecheck: true
      run-test: true
      run-coverage: true
      coverage-fail-under: 70

  ci-node:
    name: CI Node (next)
    needs: security
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-node.yml@4dd2b01e64a758b51bfd3d2395130cac8920a6b4 # v0.12.0
    with:
      node-version: "22.20.0"
      working-directory: apps/next
      package-manager: bun
      run-lint: true
      # Runs `bun run typecheck` (tsc --noEmit). oxlint alone never checks types,
      # so without this nothing guarded the front-end against a type error — in
      # particular one introduced by regenerating apps/next/api from the schema.
      run-typecheck: true
      run-test: true
      # next build needs no backend at build time; enable as a pre-merge gate on PRs.
      run-build: ${{ github.event_name == 'pull_request' }}

  # The TypeScript client in apps/next/api is generated from the server's OpenAPI
  # schema and committed. Regenerate it here and fail on any diff, so an endpoint
  # or schema change can't silently leave the front-end client behind.
  api-client-drift:
    name: API client drift
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: uv sync
      # Dumps the schema straight from the app (no server to boot), regenerates
      # the client and diffs. Fix with `make api-client`, then commit.
      - run: make api-check

  # Central docs site: verify docs/ then dispatch a rebuild of
  # kevindebenedetti.github.io (its sync-docs.ts re-clones docs/ at build time).
  dispatch-docs:
    name: Dispatch docs rebuild
    needs: [ci-python, ci-node]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docs.yml@4dd2b01e64a758b51bfd3d2395130cac8920a6b4 # v0.12.0
    with:
      client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

  # Production pipeline: main → release-please
  release:
    name: Release
    needs: [ci-python, ci-node, api-client-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@v0.13.0
    with:
      config-file: release/release-please-config-release.json
      manifest-file: release/.release-please-manifest.json
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
