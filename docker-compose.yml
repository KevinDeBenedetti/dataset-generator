# Host ports are published on 127.0.0.1 only: the local stack runs Postgres with
# default credentials, Redis and Qdrant open unless REDIS_PASSWORD and
# QDRANT_API_KEY are set, and an unauthenticated /debug/logs under
# DEBUG_LOGS=1 — none of it belongs on the LAN.
services:
  next:
    container_name: next
    restart: always
    depends_on:
      server:
        condition: service_healthy
    build:
      context: ./apps/next
      dockerfile: Dockerfile
      target: dev
      args:
        APP_PORT: ${NEXT_PORT:-3020}
      # Enable BuildKit for optimizations
      x-bake:
        cache-from:
          - type=local,src=/tmp/.buildx-cache
        cache-to:
          - type=local,dest=/tmp/.buildx-cache
    # No env_file: the web container gets only the variables below, never the
    # server's keys from .env (compose still reads .env for the ${...} values).
    # Bridge NEXT_PORT (project convention) to PORT, which `next dev -p` honours,
    # so a single variable drives the host mapping, container port, healthcheck and Next.
    environment:
      PORT: ${NEXT_PORT:-3020}
      # Dev log console (DEBUG_LOGS=1 make dev). DEBUG_LOGS drives both the
      # server-side capture + SSE proxy and the client-side terminal widget.
      DEBUG_LOGS: ${DEBUG_LOGS:-}
      NEXT_PUBLIC_DEBUG_LOGS: ${DEBUG_LOGS:-}
      # Server-to-server URL of the API (rewrites, admin check, SSE proxy).
      API_INTERNAL_URL: http://server:8000
      # The browser calls the API directly on its host port in development.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${SERVER_PORT:-8020}
    ports:
      - 127.0.0.1:${NEXT_PORT:-3020}:${NEXT_PORT:-3020}
    volumes:
      - ./apps/next:/app
      - next_node_modules:/app/node_modules
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${NEXT_PORT:-3020}/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    # Source is bind-mounted above for instant HMR; watch rebuilds the image
    # when dependencies or build config change so you don't have to do it by hand.
    develop:
      watch:
        - action: rebuild
          path: ./apps/next/package.json
        - action: rebuild
          path: ./apps/next/bun.lock
        - action: rebuild
          path: ./apps/next/next.config.ts

  server:
    container_name: server-fastapi
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Postgres, reached in-network (the host mapping below is for psql/GUI
      # clients only). Built from the same POSTGRES_* vars the database service
      # uses, so overriding the credentials in .env keeps both sides in sync.
      # Set DATABASE_URL in .env to point at a managed Postgres instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-datasets}:${POSTGRES_PASSWORD:-datasets}@postgres:5432/${POSTGRES_DB:-datasets}}
      # Shared login rate-limiter store; in-network address. Override REDIS_URL
      # in .env to point at a managed Redis.
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
      # Vector collections (services/collections.py), in-network.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # Local stack: development mode, URLs derived from the ports above.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${NEXT_PORT:-3020}}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:${SERVER_PORT:-8020}}
      # Expose /debug/logs (SSE) for the dev log console when DEBUG_LOGS=1.
      DEBUG_LOGS: ${DEBUG_LOGS:-}
      # The development accounts, admin@example.com / admin1234 and
      # user@example.com / user1234, seeded at startup (services/users.py).
      # Those weak passwords are the code's own, used in development only:
      # outside it seeding refuses them, so DEV_*_PASSWORD pass through empty.
      SEED_DEV_USERS: ${SEED_DEV_USERS:-true}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: dev
      args:
        APP_PORT: ${SERVER_PORT:-8020}
      # Enable BuildKit for optimizations
      x-bake:
        cache-from:
          - type=local,src=/tmp/.buildx-cache
        cache-to:
          - type=local,dest=/tmp/.buildx-cache
    ports:
      - "127.0.0.1:${SERVER_PORT:-8020}:8000"
    volumes:
      - ./apps/server:/app/server
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - server_venv:/app/.venv
    restart: always
    # Source is bind-mounted above for uvicorn --reload; watch rebuilds the image
    # when Python dependencies change.
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  # Executes the queued dataset jobs (python -m server.worker): the API only
  # queues them. Same image and environment as the server; scale it with
  # `docker compose up --scale worker=2` — claims never overlap.
  worker:
    depends_on:
      server:
        condition: service_healthy  # the server runs the migrations
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-datasets}:${POSTGRES_PASSWORD:-datasets}@postgres:5432/${POSTGRES_DB:-datasets}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
      # The worker builds the collections: it embeds and stores the vectors.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RUN_MIGRATIONS_ON_STARTUP: "false"
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: dev
      args:
        APP_PORT: ${SERVER_PORT:-8020}
    command: ["uv", "run", "--no-sync", "python", "-m", "server.worker"]
    volumes:
      - ./apps/server:/app/server
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - server_venv:/app/.venv
    restart: always
    stop_grace_period: 30s

  # Postgres: the application database (users, refresh tokens, quality rules).
  # The server reaches it in-network at postgres:5432; it is also published to
  # the host on the project's slot-2 Postgres port (5452) so psql / a GUI client
  # can reach it. Alembic migrations run from the server's lifespan on startup,
  # which is why the server waits for the healthcheck rather than just the
  # container start. Data persists in the postgres18_data volume (`make reset`
  # purges it), mounted at /var/lib/postgresql: from 18, the image keeps each
  # major's cluster in its own <major>/docker directory there, and refuses to
  # start on a volume left at the old /var/lib/postgresql/data.
  postgres:
    container_name: postgres
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datasets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datasets}
      POSTGRES_DB: ${POSTGRES_DB:-datasets}
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5452}:5432"
    healthcheck:
      # -U/-d are required: pg_isready otherwise probes with the *root* user and
      # reports the server ready before the init script has created the app role.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-datasets} -d ${POSTGRES_DB:-datasets}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres18_data:/var/lib/postgresql

  # Qdrant: the vector store of the collections (services/collections.py). The
  # server and the worker reach it at http://qdrant:6333; its REST API and
  # dashboard are published to the host on the project's slot-2 port (6353):
  # http://localhost:6353/dashboard. Pinned by tag and digest, in step with
  # qdrant-client in uv.lock. No healthcheck: the image has no curl or wget, so
  # the server waits for the container to start.
  qdrant:
    container_name: qdrant
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2}
    restart: always
    expose:
      - "6333"
    environment:
      # The collections' payloads hold the text of private datasets: with
      # QDRANT_API_KEY in .env, Qdrant refuses every request without it, and
      # the server and the worker (env_file) send it. Empty, Qdrant 1.20 leaves
      # authentication off rather than requiring an empty key.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6353}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Redis: shared store for the login rate limiter (so the quota holds across
  # uvicorn workers/replicas). The server reaches it in-network at
  # redis://redis:6379. Published to the host on the project's slot-2 Redis port
  # (6399) for inspection. Persistence is on (appendonly) via the volume.
  # Redis 8.8+ counts the attempts with INCREX (services/rate_limit.py).
  redis:
    container_name: redis
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: always
    # REDIS_PASSWORD from .env: any local process could otherwise read or reset
    # the login limiter's counters. Empty, `requirepass ""` means no password,
    # as before; the server's and the worker's REDIS_URL above carry it. Hex
    # only (`openssl rand -hex 32`): it goes into that URL as is.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6399}:6379"
    healthcheck:
      # Authenticates only when there is a password: redis-cli fails outright
      # on an empty one.
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

volumes:
  next_node_modules:
  server_venv:
  postgres18_data:
  qdrant_storage:
  redis_data:
