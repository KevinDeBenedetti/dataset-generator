[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Scrapy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fake-useragent>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.16.0",
    "langfuse>=4.15.1",
    "openai>=2.9.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "requests>=2.32.5",
    "scrapy>=2.18.0,<2.19",
    "sqlmodel>=0.0.42",
    "alembic>=1.19.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
    "prek>=0.5.2",
]
migration = [
    "alembic>=1.19.1",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true
