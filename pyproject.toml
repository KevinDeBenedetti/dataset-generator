[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Crawl4AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    # QA generation calls the OpenAI-compatible endpoint directly via the openai
    # SDK (see services/agent.py) — no agent framework / LiteLLM layer. crawl4ai
    # runs as a separate Docker service, so neither is a Python dependency.
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langfuse>=4.12.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.5",
    "uvicorn[standard]>=0.40.0",
    "bcrypt>=5.0.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "qdrant-client>=1.12.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "ty>=0.0.55",
    "prek>=0.2.23",
]
migration = [
    "alembic>=1.16.5",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true
