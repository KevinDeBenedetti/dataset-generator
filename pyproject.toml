[project]
name = "datasets"
version = "0.1.0"
description = "A collection of web scraping datasets powered by FastAPI and Scrapy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fake-useragent>=2.2.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langfuse>=4.13.0",
    "openai>=2.44.0",
    "pydantic>=2.0.0",
    "pytest>=9.1.1",
    "requests>=2.32.5",
    "scrapy>=2.16.0,<2.17",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.5",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "prek>=0.4.8",
]
migration = [
    "alembic>=1.18.5",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true
